<style>
  :root{

    --card:#ffffff;
    --free:#1f6f43;
    --free-bg:#e8f3ec;
    --partial:#9a5b00;
    --partial-bg:#fdf1dd;
    --ticket:#a3341f;
    --ticket-bg:#fbe9e4;
    --accent:#b8451f;

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{

    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    font-size:15px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* ── 头部 ── */
  header{

    position:relative;
    overflow:hidden;
  }
  header::before{

    background:radial-gradient(ellipse 70% 120% at 88% 0%, rgba(184,69,31,.09), transparent 62%),

  }
  .brand{display:flex;align-items:center;gap:11px;position:relative}
  .brand h1{font-size:22px;letter-spacing:-.4px;font-weight:700}
  .logo{
    width:34px;height:34px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--accent),#8f3413);
    display:grid;place-items:center;
    box-shadow:0 4px 12px -4px rgba(184,69,31,.55);
  }
  .logo svg{width:19px;height:19px}
  .tagline{
    margin-top:9px;font-size:13.5px;color:var(--ink-3);
    position:relative;max-width:640px;
  }
  .tagline b{color:var(--accent);font-weight:600}

  /* ── 查询区 ── */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-top:20px;box-shadow:var(--shadow);position:relative;
  }
  .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
  .field label{
    display:block;font-size:12px;font-weight:600;letter-spacing:.4px;
    color:var(--ink-3);text-transform:uppercase;margin-bottom:6px;
  }
  select,input[type=text]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:15px;font-family:inherit;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  select:focus,input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(184,69,31,.12);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:13px;cursor:pointer;user-select:none;
    transition:all .15s;color:var(--ink-2);font-family:inherit;
  }
  .chip:hover{border-color:#c9bfae;background:#fdfbf7}
  .chip[aria-pressed="true"]{
    background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;
  }
  .actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
  .btn{
    padding:11px 22px;border-radius:10px;border:none;cursor:pointer;
    font-size:15px;font-weight:600;font-family:inherit;
    background:var(--accent);color:#fff;
    box-shadow:0 4px 14px -6px rgba(184,69,31,.7);
    transition:transform .12s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px -7px rgba(184,69,31,.8)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{
    background:transparent;color:var(--ink-3);box-shadow:none;
    border:1px solid var(--line);font-weight:500;
  }
  .btn.ghost:hover{background:#fdfbf7;transform:none}

  .result-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin:26px 0 12px;flex-wrap:wrap;
  }

  .result-head .meta{font-size:13px;color:var(--ink-3)}
  .meta .hl{color:var(--accent);font-weight:700;font-size:15px}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 17px;margin-bottom:11px;box-shadow:var(--shadow);
    animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .card-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
  .city{
    font-size:11.5px;color:var(--ink-3);font-weight:600;
    border:1px solid var(--line);border-radius:5px;padding:1.5px 6px;

  .badge{
    font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:5px;
    letter-spacing:.2px;white-space:nowrap;
  }

  .b-plain{background:#f1ede6;color:var(--ink-3)}
  .b-book{background:#eaeef7;color:var(--accent-2)}
  .b-timed{background:#efe7f7;color:#5b3a8c}
  .b-cond{background:var(--partial-bg);color:var(--partial)}

  .row{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
  .row .k{flex:0 0 74px;color:var(--ink-3);font-weight:500}
  .row .v{flex:1;color:var(--ink-2);min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .row .v strong{color:var(--ink);font-weight:600}
  .warn{
    margin-top:10px;padding:9px 11px;border-radius:8px;font-size:13px;
    background:#fdf7ec;border-left:3px solid #d9a441;color:#6b4d12;

  .src{
    margin-top:9px;padding-top:8px;border-top:1px dotted var(--line);
    font-size:11.5px;color:#9a9186;
  }

    text-align:center;padding:52px 20px;color:var(--ink-3);

  }
  .empty .big{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:6px}

    margin-top:34px;padding:20px 0 40px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink-3);line-height:1.75;
  }

  .srcs{margin-top:6px;font-size:12px;color:var(--ink-3)}

    .grid{grid-template-columns:1fr}
    .brand h1{font-size:19px}
    .tagline{font-size:13px}
    .row .k{flex:0 0 64px}
    .card-top{flex-direction:column;gap:8px}
  }

    .warn{font-size:12.5px;padding:8px 10px}

const CITIES = [...new Set(SPOTS.map(s=>s.city))]
  .sort((a,b)=>REGIONS.indexOf(a)-REGIONS.indexOf(b));

const FREE_LABEL = {
  totally:{t:"完全免费", c:"b-free"},
  partial:{t:"主体免费·局部收费", c:"b-partial"},
  cond:{t:"凭证免费", c:"b-partial"},
  timed:{t:"限定时段免费", c:"b-timed"},
  ticket:{t:"收费", c:"b-ticket"}
};

const $ = id => document.getElementById(id);
const dayName = d => ["周日","周一","周二","周三","周四","周五","周六"][d];

/* 初始化下拉框 */
(function init(){
  const c = $("city");
  c.innerHTML = '<option value="any">全部城市</option>' +
    CITIES.map(x=>`<option value="${x}">${x}</option>`).join("");
})();

/* 标签按钮状态 */
const active = new Set();
$("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip");
  if(!b) return;
  const f = b.dataset.f;
  if(active.has(f)){ active.delete(f); b.setAttribute("aria-pressed","false"); }
  else { active.add(f); b.setAttribute("aria-pressed","true"); }
});

$("reset").addEventListener("click", ()=>{
  $("city").value="any"; $("day").value="any"; $("duration").value="any";
  active.clear();
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  run();
});

$("go").addEventListener("click", run);

/* 核心理由生成：说明为什么可去 / 为什么被排除 */
function judge(s, day, durMax){
  const reasons = [];
  let ok = true;

  // 闭馆判定
  if(day !== null && s.closed.includes(day)){
    ok = false;
    reasons.push(`${dayName(day)}闭馆`);
  }
  // 分区错峰特例
  if(s.closedNote && day !== null){
    const m = s.closedNote;
    if(day===1) reasons.push("南区周一闭馆，北区（红楼）仍开放");
    if(day===2) reasons.push("北区周二闭馆，南区仍开放");
  }
  // 时长判定
  if(durMax !== null && s.dur > durMax){
    ok = false;
    reasons.push(`建议停留约 ${Math.round(s.dur/60)} 小时，超出你给的 ${Math.round(durMax/60)} 小时`);
  }
  // 时段限定
  if(s.free === "timed"){
    reasons.push("仅在晚间开放，白天前往会落空");
  }
  return {ok, reasons};
}

function run(){
  const city = $("city").value;
  const dv = $("day").value;
  const day = dv === "any" ? null : parseInt(dv,10);
  const du = $("duration").value;
  const durMax = du === "any" ? null : parseInt(du,10);

  let list = SPOTS.filter(s => city==="any" || s.city===city);

  // 标签过滤
  if(active.has("nobook"))  list = list.filter(s=>!s.book);
  if(active.has("totally")) list = list.filter(s=>s.free!=="ticket");
  if(active.has("indoor"))  list = list.filter(s=>s.indoor);
  if(active.has("night"))   list = list.filter(s=>s.night || s.free==="timed");
  if(active.has("kid"))     list = list.filter(s=>s.kid);
  if(active.has("free"))    list = list.filter(s=>s.local);

  // 排序权重：免费程度 → 数据完整度 → 馆藏分量(tier) → 停留时长
  // 说明：带 note（数据存疑）的条目下沉，避免首屏出现信息最不扎实的馆
  const RANK = { totally:0, partial:1, cond:2, timed:3, ticket:4 };
  const judged = list.map(s=>({s, ...judge(s, day, durMax)}));
  const pass = judged.filter(x=>x.ok).sort((a,b)=>{
    const r = (RANK[a.s.free]??9) - (RANK[b.s.free]??9);
    if(r !== 0) return r;
    const na = a.s.note?1:0, nb = b.s.note?1:0;
    if(na !== nb) return na - nb;           // 数据存疑的下沉
    const ta = a.s.tier??3, tb = b.s.tier??3;
    if(ta !== tb) return ta - tb;           // 馆藏分量重的优先
    return a.s.dur - b.s.dur;
  });
  const drop = judged.filter(x=>!x.ok);

  // 结果头
  const bits = [];
  bits.push(city==="any" ? "湖北全省" : city);
  if(day!==null) bits.push(dayName(day));
  if(durMax!==null) bits.push(`${Math.round(durMax/60)} 小时内`);
  if(active.size) bits.push([...active].map(f=>({
    nobook:"免预约", totally:"完全免费", indoor:"室内",
    night:"夜间", kid:"带娃", free:"本地人常去"
  })[f]).join(" + "));
  $("rTitle").textContent = "筛选结果";
  $("rMeta").innerHTML = `${bits.join(" · ")} — 可去 <span class="hl">${pass.length}</span> 个` +
    (drop.length ? `，另有 ${drop.length} 个因条件不符被排除` : "");

  const box = $("list");
  if(!pass.length){
    box.innerHTML = `<div class="empty">
      <div class="big">没有完全匹配的景点</div>
      试着放宽日期或时长条件，或取消部分标签筛选。<br>
      ${drop.length ? `当前有 ${drop.length} 个景点因闭馆或时长原因被排除。` : ""}
    </div>`;
  } else {
    box.innerHTML = pass.map((x,i)=>card(x.s, x.reasons, i)).join("");
  }

  // 被排除但仍列出原因，避免用户误以为漏了
  if(drop.length){
    box.insertAdjacentHTML("beforeend", `
      <div class="result-head" style="margin:26px 0 10px">
        <h2 style="font-size:14.5px;color:var(--ink-3)">本次被排除的（说明原因）</h2>
      </div>` +
      drop.map(x=>card(x.s, x.reasons, 0, true)).join("")
    );
  }
}

function card(s, reasons, i, dim){
  const fl = FREE_LABEL[s.free] || FREE_LABEL.totally;
  const badges = [
    `<span class="badge ${fl.c}">${fl.t}</span>`,
    s.book
      ? `<span class="badge b-book">需预约</span>`
      : `<span class="badge b-plain">免预约</span>`,
    s.indoor ? `<span class="badge b-plain">室内</span>` : `<span class="badge b-plain">户外</span>`
  ].join("");

  const closedTxt = s.closedNote
    ? s.closedNote
    : (s.closed.length ? `${s.closed.map(dayName).join("、")}闭馆（法定节假日除外）` : "全年开放（春节等特殊时段除外）");

  const warn = s.free==="partial" && s.special
    ? `<div class="warn"><b>注意：</b>${s.special}</div>`
    : (s.special && s.free==="timed" ? `<div class="warn"><b>注意：</b>${s.special}</div>` : "");

  const noteBox = s.note
    ? `<div class="warn" style="background:#fdecea;border-left-color:#a3341f;color:#7d2a19"><b>数据存疑：</b>${s.note}</div>`
    : "";

  const reasonTxt = reasons && reasons.length && !dim
    ? `<div class="warn" style="background:#eef4fb;border-left-color:#1d4e89;color:#1d3f6b"><b>提示：</b>${reasons.join("；")}</div>`
    : "";

  const srcTxt = s.src
    ? `<div class="src">来源：${s.src}</div>`
    : "";

  return `<article class="card" style="animation-delay:${i*32}ms${dim?';opacity:.62':''}">
    <div class="card-top">
      <h3>${s.n}<span class="city">${s.city}</span></h3>
    </div>
    <div class="badges">${badges}</div>
    <div class="rows">
      <div class="row"><div class="k">开放时间</div><div class="v">${s.hours}</div></div>
      <div class="row"><div class="k">闭馆日</div><div class="v">${closedTxt}</div></div>
      <div class="row"><div class="k">怎么进</div><div class="v">${s.bookway}</div></div>
      <div class="row"><div class="k">地址</div><div class="v">${s.addr}</div></div>
      <div class="row"><div class="k">提醒</div><div class="v">${s.tip}</div></div>
      ${s.special && s.free!=="partial" && s.free!=="timed"
        ? `<div class="row"><div class="k">特别说明</div><div class="v">${s.special}</div></div>` : ""}
    </div>
    ${warn}${noteBox}${reasonTxt}${srcTxt}
  </article>`;
}

/* 首屏直接出结果，打开就能看见东西 */
(function boot(){
  // 覆盖统计注入页脚
  const cov = document.getElementById("coverage");
  if(cov){
    const have = CITIES.length;
    const miss = REGIONS.filter(r=>!CITIES.includes(r));
    cov.innerHTML = `已收录 <b>${have}</b> 个市州林区、共 <b>${SPOTS.length}</b> 个免费景点` +
      (miss.length ? `；${miss.join("、")}暂未收录到可核实的官方数据。` : "，湖北全省 17 个市州林区全覆盖。");
  }

  // 支持 URL 参数预置筛选状态，便于分享具体查询（如 ?city=武汉&day=1&f=nobook,indoor）
  const q = new URLSearchParams(location.search);
  const c = q.get("city"); if(c){ $("city").value = c; }
  const d = q.get("day");  if(d){ $("day").value = d; }
  const t = q.get("dur");  if(t){ $("duration").value = t; }
  const f = q.get("f");
  if(f){
    f.split(",").forEach(k=>{
      const b = document.querySelector(`.chip[data-f="${k}"]`);
      if(b){ active.add(k); b.setAttribute("aria-pressed","true"); }
    });
  }
  run();
})();
</script>
